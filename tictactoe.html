<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; padding: 24px; }
  h1 { margin-bottom: 8px; font-size: 3rem; }
  #status { font-size: 1.2rem; margin: 12px 0; min-height: 1.5em; }
  #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 6px; }
  .cell { width: 100px; height: 100px; font-size: 3rem; font-weight: bold; background: #fff; border: 2px solid #333; border-radius: 8px; cursor: pointer; }
  .cell:hover:not(:disabled) { background: #e0e7ff; }
  .cell.win { background: #bbf7d0; }
  .X { color: #2563eb; } .O { color: #dc2626; }
  .controls { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
  button.reset { padding: 8px 16px; font-size: 2rem; cursor: pointer; }
  #score { margin-top: 12px; font-size: 2rem; }
  #status { font-size: 2rem; }
  .font-size { font-size: 2rem; }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div class="controls">
  <label class="font-size">Mode:
    <select  class="font-size" id="mode">
      <option value="2p">Two players</option>
      <option value="cpu">Vs computer</option>
    </select>
  </label>
  <button class="reset" id="reset">New game</button>
</div>
<div id="status"></div>
<div id="board"></div>
<div id="score"></div>

<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('score');
const modeEl = document.getElementById('mode');
let board, turn, over;
const score = { X: 0, O: 0, draw: 0 };

const cells = [...Array(9)].map((_, i) => {
  const b = document.createElement('button');
  b.className = 'cell';
  b.addEventListener('click', () => play(i));
  boardEl.appendChild(b);
  return b;
});

function winnerOf(b) {
  for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { player: b[l[0]], line: l };
  return null;
}

function newGame() {
  board = Array(9).fill(null);
  turn = 'X';
  over = false;
  cells.forEach(c => { c.textContent = ''; c.className = 'cell'; c.disabled = false; });
  render();
}

function play(i) {
  if (over || board[i]) return;
  if (modeEl.value === 'cpu' && turn === 'O') return;
  move(i);
  if (!over && modeEl.value === 'cpu' && turn === 'O') setTimeout(() => move(bestMove()), 300);
}

function move(i) {
  board[i] = turn;
  cells[i].textContent = turn;
  cells[i].classList.add(turn);
  cells[i].disabled = true;
  const w = winnerOf(board);
  if (w) {
    over = true;
    score[w.player]++;
    w.line.forEach(k => cells[k].classList.add('win'));
    cells.forEach(c => c.disabled = true);
    statusEl.textContent = `${w.player} wins!`;
  } else if (board.every(Boolean)) {
    over = true;
    score.draw++;
    statusEl.textContent = "It's a draw.";
  } else {
    turn = turn === 'X' ? 'O' : 'X';
    statusEl.textContent = `${turn}'s turn`;
  }
  renderScore();
}

// Minimax: computer plays O and never loses.
function minimax(b, player) {
  const w = winnerOf(b);
  if (w) return w.player === 'O' ? 1 : -1;
  if (b.every(Boolean)) return 0;
  let best = player === 'O' ? -2 : 2;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = player;
    const s = minimax(b, player === 'O' ? 'X' : 'O');
    b[i] = null;
    best = player === 'O' ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}

function bestMove() {
  let bestScore = -2, bestI = -1;
  for (let i = 0; i < 9; i++) {
    if (board[i]) continue;
    board[i] = 'O';
    const s = minimax(board, 'X');
    board[i] = null;
    if (s > bestScore) { bestScore = s; bestI = i; }
  }
  return bestI;
}

function render() { statusEl.textContent = `${turn}'s turn`; renderScore(); }
function renderScore() { scoreEl.innerHTML  = `Win/Loss - &nbsp;X: &nbsp; ${score.X} &nbsp; O: ${score.O} &nbsp; Draws: ${score.draw}`; }

document.getElementById('reset').addEventListener('click', newGame);
modeEl.addEventListener('change', newGame);
newGame();
</script>
</body>
</html>
