<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
	
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
			justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
			margin-top: 20px;
        }

        h1 {
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background-color: #333;
            padding: 5px;
            border-radius: 8px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:hover {
            background-color: #eee;
        }

        .status {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
        <h1>Tic Tac Toe</h1>
        <div class="board" id="board">
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
            <div class="cell" ></div>
        </div>
        <div class="status" id="status">Player X's turn</div>
        <button onclick="resetGame()">Restart Game</button>


    <script>
        // Get DOM elements
        const cells = document.querySelectorAll('.cell');
        const status = document.getElementById('status');

        // Game state variables
        let currentPlayer = 'X';
        let gameActive = true;
        let gameState = ['', '', '', '', '', '', '', '', ''];

        // Winning combinations (indices of cells)
        const winConditions = [
            [0, 1, 2],   // Rows
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],   // Columns
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],   // Diagonals
            [2, 4, 6]
        ];

        // Initialize the game by adding click event listeners to all cells
        function initializeGame() {
            cells.forEach(cell => {
                cell.addEventListener('click', () => handleCellClick(cell));
            });
        }

        // Handle cell clicks
        function handleCellClick(cell) {
            const index = Array.from(cells).indexOf(cell);

            if (!gameActive || gameState[index] !== '') return;

            // Update game state and DOM
            gameState[index] = currentPlayer;
            cell.textContent = currentPlayer;
            
            // Check for win or draw
            checkResult();

            if( gameActive )
			{
              // Switch player
              currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
              status.textContent = `Player ${currentPlayer}'s turn`;
			}
        }

        // Check if current move has won the game or if it's a draw
        function checkResult() {
            let win = false;

            // Check all winning combinations
            winConditions.forEach(condition => {
                const [a, b, c] = condition;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    win = true;
                    highlightWinningCells(condition);
                    gameActive = false;
                    status.textContent = `Player ${currentPlayer} wins!`;
                }
            });

            let hasEmptyCell = false;
            gameState.forEach(cellState => {
			   if(!cellState) { 
			      hasEmptyCell = true; 
			   }
			});
            // Check for draw
            if (!hasEmptyCell && !win) {
                status.textContent = "Game is a draw!";
				gameActive = false;
            }
        }

        // Highlight winning cells
        function highlightWinningCells(condition) {
            condition.forEach(index => {
                const cell = Array.from(cells)[index];
                cell.style.backgroundColor = '#e0f4ff';
            });
        }

        // Reset the game
        function resetGame() {
            currentPlayer = 'X';
            gameActive = true;
            gameState = ['', '', '', '', '', '', '', '', ''];
            status.textContent = `Player ${currentPlayer}'s turn`;
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.style.backgroundColor = '#fff'; // Reset background color
            });
        }

        // Start the game
        initializeGame();
    </script>
</body>
</html>
